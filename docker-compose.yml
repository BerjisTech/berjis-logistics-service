services:
  cribs-db:
    image: postgres:15-alpine
    container_name: cribs-db
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: berjis_cribs
    ports:
      - "5434:5432"
    volumes:
      - cribs_pgdata:/var/lib/postgresql/data

  cribs:
    build: .
    container_name: cribs-service
    depends_on:
      - cribs-db
    environment:
      APP_NAME: berjis-cribs
      APP_ENV: development
      PORT: "8095"
      DATABASE_URL: postgres://postgres:postgres@cribs-db:5432/berjis_cribs?sslmode=disable
      CORE_API_BASE: http://host.docker.internal:8080
      ALLOWED_ORIGINS: http://localhost:4300,https://cribs.berjis.tech,https://cribs-api.berjis.tech
      AUTH_JWT_HS256_SECRET: change-me-dev-only
    ports:
      - "8095:8095"

volumes:
  cribs_pgdata: {}
